name = "mini"
srcDir = "src"
defaultTargets = ["Main"]
moreLeanArgs = ["--tstack=400000"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false
maxSynthPendingDepth = 3
pp.unicode.fun = true
maxHeartbeats = 4000000

[[require]]
name = "aesop"
git = "https://github.com/leanprover-community/aesop"
rev = "3448c0bcc5ce01b2d1546e483ec3620e32df3d0e"

[[lean_lib]]
name = "Main"
roots = ["Main"]

[[lean_lib]]
name = "Delay"
roots = ["Delay"]
